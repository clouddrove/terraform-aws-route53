name: tfsec
permissions: write-all
on:
  push:
    branches:
      - master
    paths:
      - '**/*.tf'
      - '*.tf'
  pull_request:
    paths:
      - '**/*.tf'
      - '*.tf'
  workflow_dispatch:
jobs:
  tfsec:
    uses: clouddrove/github-shared-workflows/.github/workflows/tfsec.yml@master
    secrets: inherit
    with:
      working_directory: '.'
